  <rect x="156" y="216" width="40" height="40" fill="#ffaaaa"/>
  <rect x="236" y="216" width="40" height="40" fill="#ffaaaa"/>
  <rect x="316" y="216" width="40" height="40" fill="#ffaaaa"/>
  <rect x="396" y="216" width="40" height="40" fill="#ffaaaa"/>
  <rect x="76" y="256" width="40" height="40" fill="#ffaaaa"/>
  <rect x="156" y="256" width="40" height="40" fill="#ffaaaa"/>
  <rect x="236" y="256" width="40" height="40" fill="#ffaaaa"/>
  <rect x="316" y="256" width="40" height="40" fill="#ffaaaa"/>
  <rect x="356" y="256" width="40" height="40" fill="#ffaaaa"/>
